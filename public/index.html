<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>learn-qec</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .box {
      text-align: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 3rem 4rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.25rem;
      background: linear-gradient(to right, #ffffff, #c7d2fe, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      margin: 0;
    }
    .status {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-family: monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>learn-qec</h1>
    <p>High-performance Quantum Error Correction playground & video engine.</p>
    <div class="status">● GitHub Pages deployment active</div>
  </div>
</body>
</html>
