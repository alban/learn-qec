[package]
name = "qec_engine"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust/Wasm quantum error correction simulation and decoding engine"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"
binar = "0.1.4"
paulimer = "0.2.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
